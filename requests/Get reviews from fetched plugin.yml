info:
  name: Get reviews from fetched plugin
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/answer?pluginId={{PLUGIN_ID}}"
  params:
    - name: pluginId
      value: "{{PLUGIN_ID}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Waits for collection and validates the saved reviews", async function () {
          expect(res.getStatus()).to.equal(200);
          const body = res.getBody();
          expect(body.pluginId).to.equal(Number(bru.getVar("PLUGIN_ID")));
          expect(body.requestedAt).to.be.a("string").and.match(/Z$/);
          const requestedAt = Date.parse(body.requestedAt);
          expect(Number.isNaN(requestedAt)).to.equal(false);
          if (["QUEUED", "RUNNING"].includes(body.status)) {
            expect(body.completedAt).to.equal(null);
            expect(Date.now(), "Collection did not finish within 15 seconds")
              .to.be.below(Number(bru.getVar("REVIEW_POLL_DEADLINE")));
            await bru.sleep(250);
            bru.runner.setNextRequest("Get reviews from fetched plugin");
            return;
          }
          expect(body.status, body.error || "Collection did not succeed").to.equal("SUCCEEDED");
          expect(body.completedAt).to.be.a("string").and.match(/Z$/);
          expect(Date.parse(body.completedAt)).to.be.at.least(requestedAt);
          expect(body.error).to.equal(null);
          expect(body.reviews).to.be.an("array");

          const ids = new Set();
          for (const review of body.reviews) {
            expect(Number.isInteger(review.id)).to.equal(true);
            expect(ids.has(review.id)).to.equal(false);
            ids.add(review.id);
            expect(review.text).to.be.a("string").and.not.be.empty;
            expect(review.author).to.be.a("string").and.not.be.empty;
            expect(review.rating).to.be.oneOf([1, 2, 3, 4, 5]);
            expect(review.publishedAt).to.be.a("string").and.match(/Z$/);
            expect(Number.isNaN(Date.parse(review.publishedAt))).to.equal(false);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  forwardAuthorizationHeader: false

docs: Подставляет `PLUGIN_ID` и при запуске коллекции ждет завершения сбора до 15 секунд. При успехе проверяет статус `SUCCEEDED`, даты и поля отзывов.
