info:
  name: Reject invalid plugin ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/answer?pluginId=0"
  params:
    - name: pluginId
      value: "0"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejects a non-positive plugin ID", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().detail).to.equal("pluginId must be positive");
        });
