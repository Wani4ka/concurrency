info:
  name: Reject unsupported plugin URL
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/post"
  body:
    type: json
    data: |-
      {
        "url": "https://example.org/plugin/164-ideavim"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejects a URL outside JetBrains Marketplace", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().detail).to.equal("Expected a JetBrains Marketplace plugin URL");
        });

docs: Проверяет ответ `400` и поле `detail` для ссылки с посторонним доменом.
