info:
  name: Reject invalid minimum rating
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/answer?pluginId=164&minRating=6"
  params:
    - name: pluginId
      value: "164"
      type: query
    - name: minRating
      value: "6"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejects a minimum rating above 5", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().detail).to.equal("minRating must be between 1 and 5");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  forwardAuthorizationHeader: false

docs: Проверяет ответ `400` и причину ошибки в поле `detail` для `minRating=6`.
