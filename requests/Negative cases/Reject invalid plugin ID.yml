info:
  name: Reject invalid plugin ID
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/answer?pluginId=0"
  params:
    - name: pluginId
      value: "0"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejects a non-positive plugin ID", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().detail).to.equal("pluginId must be positive");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Проверяет ответ `400` и поле `detail` для `pluginId=0`.
