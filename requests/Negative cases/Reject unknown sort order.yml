info:
  name: Reject unknown sort order
  type: http
  seq: 5

http:
  method: GET
  url: "{{BASE_URL}}/answer?pluginId=164&sort=unknown"
  params:
    - name: pluginId
      value: "164"
      type: query
    - name: sort
      value: unknown
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejects an unknown sort order", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody().detail).to.equal("sort must be dateAsc or dateDesc");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  forwardAuthorizationHeader: false

docs: Проверяет ответ `400` и причину ошибки в поле `detail` для `sort=unknown`.
