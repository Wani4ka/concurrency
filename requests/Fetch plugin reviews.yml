info:
  name: Fetch plugin reviews
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/post"
  body:
    type: json
    data: |-
      {
        "url": "{{PLUGIN_URL}}"
      }
  auth: inherit

runtime:
  variables:
    - name: PLUGIN_URL
      value: https://plugins.jetbrains.com/plugin/164-ideavim
  scripts:
    - type: tests
      code: |-
        test("Collection was accepted and saved the plugin ID", function () {
          expect(res.getStatus()).to.equal(202);
          const pluginId = res.getBody().pluginId;
          expect(Number.isInteger(pluginId)).to.equal(true);
          expect(pluginId).to.be.greaterThan(0);
          expect(Number(bru.getVar("PLUGIN_ID"))).to.equal(pluginId);
          bru.setVar("REVIEW_POLL_DEADLINE", Date.now() + 15000);
        });
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res('pluginId')
        method: jsonq
      variable:
        name: PLUGIN_ID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  forwardAuthorizationHeader: false

docs: Ставит сбор в очередь, проверяет `202 Accepted` и сохраняет `PLUGIN_ID`. Ссылка на плагин задается переменной `PLUGIN_URL`. По умолчанию используется IdeaVim.
